[defaults]
inventory           = inventories/cloud_vms/hosts.yml
host_key_checking   = false
forks               = 5
timeout             = 20
gathering           = smart
retry_files_enabled = false
vault_password_file = ~/.ansible/vault_pass

[ssh_connection]
pipelining          = true
ssh_args            = -o ControlMaster=auto -o ControlPersist=60s