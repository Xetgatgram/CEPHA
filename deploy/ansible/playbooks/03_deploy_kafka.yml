---
- name: VM2 deployen – Kafka + Producer
  hosts: kafka
  become: true


  vars_files:
    - ../inventories/cloud_vms/group_vars/vault.yml

  tasks:

    # Ordner
    - name: Projektordner anlegen
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Unterordner anlegen
      ansible.builtin.file:
        path: "{{ project_dir }}/{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      loop:
        - pcap-files
        - images

    # Konfig-dateien
    - name: Docker-Compose übertragen
      ansible.builtin.copy:
        src: "../../compose/docker-compose.kafka.yml"
        dest: "{{ project_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Kafka-Init übertragen03
      ansible.builtin.copy:
        src: "../init-kafka-topics.sh"
        dest: "{{ project_dir }}/init-kafka-topics.sh"
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: .env-Datei erstellen
      ansible.builtin.copy:
        content: |
          KAFKA_EXTERNAL_IP={{ ansible_host }}
          PCAP_PATH=/pcap-files/
        dest: "{{ project_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: '0600'


    - name: Images pullen
      community.docker.docker_image:
        name: "{{ item.source }}"
        source: pull
        force_source: true
      loop: "{{ images }}"
      #delegate_to: localhost
      #become: false

