---
- name: Alle VMs vorbereiten - Docker installieren
  hosts: gesamt
  become: true

  tasks:
    - name: APT Cache aktualisieren
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Konfliktende Docker-Pakete entfernen
      ansible.builtin.apt:
        name: "{{ docker_conflicting_packages }}"
        state: absent
        purge: true

    - name: Benötigte Pakete installieren
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Keyrings-Verzeichnis anlegen
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Docker GPG-Key herunterladen
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0444'

    - name: Docker Repository hinzufügen
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }}
          stable
        state: present
        filename: docker

    - name: Docker installieren
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true

    - name: Ubuntu-User zur Docker-Gruppe hinzufügen
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users }}"

    - name: Docker Service aktivieren und starten
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
