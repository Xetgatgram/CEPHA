# =============================================================================
# Lokales Test-Deployment – simuliert 5 VMs auf einer Maschine
# Start: docker compose -f docker-compose.localnodes.yml up -d
# =============================================================================
x-openobserve: &openobserve-credentials          # zentrale Credentials - Werte kommen aus .env (siehe .env.example)
  OPENOBSERVE_HOST: openobserve
  OPENOBSERVE_PORT: "5080"
  OPENOBSERVE_ORG: cepha
  OPENOBSERVE_STREAM: detection-results
  OPENOBSERVE_USER: ${OPENOBSERVE_USER:-admin@admin.local}
  OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:?Bitte OPENOBSERVE_PASSWORD in .env setzen (min. 8 Zeichen, OpenObserve v0.91+ erzwingt ein Mindestmass an Passwortstärke)}


services:

  # =====Jobmanager + Monitoring ====

  flink-volume-init:
    image: busybox
    container_name: flink-volume-init
    command: sh -c "
      mkdir -p /opt/flink/results-jm /opt/flink/results-tm1 /opt/flink/results-tm2 /opt/flink/results-tm3 /opt/flink/dlq &&
      chown -R 9999:9999 /opt/flink/results-jm /opt/flink/results-tm1 /opt/flink/results-tm2 /opt/flink/results-tm3 /opt/flink/dlq &&
      chmod -R 777 /opt/flink/results-jm /opt/flink/results-tm1 /opt/flink/results-tm2 /opt/flink/results-tm3 /opt/flink/dlq"
    volumes:
      - flink_results_jm:/opt/flink/results
      - flink_results_tm1:/opt/flink/results-tm1
      - flink_results_tm2:/opt/flink/results-tm2
      - flink_results_tm3:/opt/flink/results-tm3
      - flink_dlq:/opt/flink/dlq

  jobmanager:
    image: ghcr.io/xetgatgram/cepha-manager:26.07.1
   # build:
    #  context: ../..
    #  dockerfile: deploy/docker/Dockerfile.jobmanager
    container_name: flink-jobmanager
    command: jobmanager
    user: "9999:9999"
    ports:
      - "6123:6123"
      - "8081:8081"
      - "9249:9249"
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
      FLINK_PROPERTIES: |
        state.backend: rocksdb
        state.backend.rocksdb.memory.managed: true
        taskmanager.memory.managed.size: 256mb
        execution.checkpointing.incremental: true
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        state.backend.rocksdb.timer-service.factory: heap
        jobmanager.rpc.address: jobmanager
        jobmanager.bind-host: 0.0.0.0
        jobmanager.rpc.port: 6123
        rest.address: jobmanager
        rest.bind-address: 0.0.0.0
        taskmanager.numberOfTaskSlots: 4
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink_results_jm:/opt/flink/results
      - plugin_storage:/opt/flink-plugins
      - flink_dlq:/opt/flink/dlq
    depends_on:
      flink-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cepha-network
    restart: on-failure

  framework:
    image: ghcr.io/xetgatgram/cepha-rest:26.07.1
   # build:
    #  context: ../..
    #  dockerfile: deploy/docker/Dockerfile
    container_name: framework-rest-api
    ports:
      - "8080:8080"
    environment:
      flink.cluster.host: jobmanager
      flink.cluster.port: "6123"
      FLINK_CLUSTER_REST_PORT: 8081
      KAFKA_BOOTSTRAPSERVERS: kafka:29092
      PLUGIN_STORAGE_DIR: /opt/flink-plugins
      FLINK_DASHBOARD_URL: http://jobmanager:8081
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 100MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 100MB
      KAFKA_ADMIN_AUTO_CREATE_TOPICS: "true"
      kafka.producer.pcap-upload-dir: /pcap-files
      CEPHA_OUTPUT_PATH: /opt/flink/results
      CEPHA_DLQ_PATH: /opt/flink/dlq
    volumes:
      - plugin_storage:/opt/flink-plugins
      - /mnt/e/covert-channel-framework/pcap-files:/pcap-files:ro
    depends_on:
      - jobmanager
      - kafka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cepha-network
    restart: on-failure

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8888"   # Prometheus metrics
    volumes:
      - ../observability/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      <<: *openobserve-credentials
      # Base64-Auth-Header wird zur Laufzeit im Container aus OPENOBSERVE_USER/PASSWORD
      # berechnet (siehe otel-collector-config.yml, kein hartcodierter Wert mehr -
      # verhindert dass Passwort-Aenderungen hier vergessen werden)
      JOBMANAGER_HOST: "jobmanager"
      TASKMANAGER1_HOST: "taskmanager1"
      TASKMANAGER2_HOST: "taskmanager2"
      TASKMANAGER3_HOST: "taskmanager3"
      EXPERIMENT_TM_COUNT: "3"                  #  anpassen
      EXPERIMENT_WINDOW_STRATEGY: "tumbling"    #  anpassen
    depends_on:
      - openobserve
      - jobmanager
      - taskmanager1
    networks:
      - cepha-network
    restart: always

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    ports:
      - "5080:5080"
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_USER:-admin@admin.local}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD:?Bitte OPENOBSERVE_PASSWORD in .env setzen (min. 8 Zeichen, OpenObserve v0.91+ erzwingt ein Mindestmass an Passwortstaerke)}
      ZO_QUERY_DEFAULT_LIMIT: "1000000000"
      ZO_MAX_DASHBOARD_SERIES: "1000000000"
    volumes:
      - openobserve_data:/data
    networks:
      - cepha-network
    restart: always

  # ===== Kafka + Producer =====

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    user: "0:0" #root -> user:group auf testsystem vertretbar
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: -1 # Disable log retention Time, never delete
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - /mnt/e/Master_project/kafkaData:/var/lib/kafka/data
      - ../init-kafka-topics.sh:/init-kafka-topics.sh
    command: >
      bash -c "
      /etc/confluent/docker/run &
      echo 'Warte auf Kafka...' &&
      until kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1; do
        sleep 2;
      done &&
      bash /init-kafka-topics.sh && wait"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cepha-network

  # ===== Taskmanager 1 =====

  taskmanager1:
    image: ghcr.io/xetgatgram/cepha-manager:26.07.1
   # build:
    #  context: ../..
   #   dockerfile: deploy/docker/Dockerfile.jobmanager
    container_name: flink-taskmanager-1
    command: taskmanager
    user: "9999:9999"
    ports:
      - "9250:9249"
    environment:
      CEPHA_DLQ_PATH: /opt/flink/dlq
      JOB_MANAGER_RPC_ADDRESS: jobmanager
      FLINK_PROPERTIES: |
        state.backend: rocksdb
        state.backend.rocksdb.memory.managed: true
        taskmanager.memory.managed.size: 256mb
        execution.checkpointing.incremental: true
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        state.backend.rocksdb.timer-service.factory: heap
        jobmanager.rpc.address: jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.network.fraction: 0.2
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink_results_tm1:/opt/flink/results
      - flink_dlq:/opt/flink/dlq
    depends_on:
       jobmanager:
          condition: service_healthy
    networks:
      - cepha-network
    restart: on-failure

  fluent-bit-tm1:
    image: ghcr.io/xetgatgram/cepha-fluent-bit:26.07.1
    #build:
     # context: ../..
     # dockerfile: deploy/docker/Dockerfile.fluent-bit
    container_name: fluent-bit-tm1
    volumes:
      - flink_results_tm1:/opt/flink/results:ro
    environment:
      <<: *openobserve-credentials
      FLUENT_BIT_SOURCE: taskmanager
      FLUENT_BIT_DB_NAME: fluent-bit-taskmanager1.db
    depends_on:
      - openobserve
    networks:
      - cepha-network
    restart: always

