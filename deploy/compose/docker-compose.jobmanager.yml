# Jobmanager + REST-API + Monitoring
services:
  # Volume Init
  flink-volume-init:
    image: busybox:latest
    container_name: flink-volume-init
    command: sh -c "mkdir -p /opt/flink/dlq /opt/flink/checkpoints &&
      chown -R 9999:9999 /opt/flink/dlq /opt/flink/checkpoints &&
      chmod -R 777 /opt/flink/dlq /opt/flink/checkpoints"
    volumes:
      - flink_dlq:/opt/flink/dlq
      - flink_checkpoints:/opt/flink/checkpoints
  # Flink JobManager
  jobmanager:
    image: ghcr.io/xetgatgram/cepha-manager:26.07.1
    container_name: flink-jobmanager
    command: jobmanager
    user: "9999:9999"
    ports:
      - "6123:6123"
      - "6124:6124"
      - "8081:8081"
      - "9249:9249"
      - "6125:6125"
    environment:
      JOB_MANAGER_RPC_ADDRESS: "${JOBMANAGER_HOST}"
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: ${JOBMANAGER_HOST}
        jobmanager.bind-host: 0.0.0.0
        jobmanager.rpc.port: 6123
        blob.server.port: 6124
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        metrics.internal.query-service.port: 6125
        pekko.framesize: 64m
        # --- State Backend: hashmap = State im Heap (schnell); Intervall/Toleranz setzt der Job-Code ---
        state.backend.type: hashmap
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        execution.checkpointing.num-retained: 1
        # --- Heartbeat & Timeout ---
        heartbeat.interval: 10000
        heartbeat.timeout: 120000
        heartbeat.rpc-failure-threshold: 5
        akka.ask.timeout: 120s
        akka.tcp.timeout: 120s
        web.timeout: 600000
    volumes:
      - plugin_storage:/opt/flink-plugins
      - flink_dlq:/opt/flink/dlq
      - flink_checkpoints:/opt/flink/checkpoints
    depends_on:
      flink-volume-init:
        condition: service_completed_successfully
    networks:
      - cepha-network
    restart: on-failure

  # REST API

  framework:
    image: ghcr.io/xetgatgram/cepha-rest:26.08.1   # ANPASSEN: Tag des neu gebauten Images mit Checkpoint-Fix
    container_name: framework-rest-api
    ports:
      - "8080:8080"
    environment:
      CEPHA_CHECKPOINT_INTERVAL_MS: "120000"   # Checkpoint-Intervall 2 min (liest der Job-Code)
      flink.cluster.host: jobmanager
      flink.cluster.port: "6123"
      FLINK_CLUSTER_REST_PORT: 8081
      PLUGIN_STORAGE_DIR: /opt/flink-plugins
      FLINK_DASHBOARD_URL: http://jobmanager:8081
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 100MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 100MB
      # Kafka Admin Client Config
      KAFKA_BOOTSTRAPSERVERS: "${KAFKA_BOOTSTRAPSERVERS}:9092"
      KAFKA_ADMIN_AUTO_CREATE_TOPICS: "true"
      kafka.producer.pcap-upload-dir: /pcap-files
      #O Output-File Config
      CEPHA_OUTPUT_PATH: /opt/flink/results
      CEPHA_DLQ_PATH: /opt/flink/dlq
    volumes:
      - plugin_storage:/opt/flink-plugins
      - pcap_uploads:/tmp/pcap-uploads
      - /mnt/data/pcap-upload:/pcap-files:ro
    depends_on:
      - jobmanager
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cepha-network
    restart: on-failure
    cap_add: # for network capture
      - NET_ADMIN
      - NET_RAW

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8888"   # Prometheus metrics
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      # Base64-kodierter Auth-Header wird automatisch berechnet
      JOBMANAGER_HOST: "${JOBMANAGER_HOST}"
      TASKMANAGER1_HOST: "${TASKMANAGER1_HOST}"
      TASKMANAGER2_HOST: "${TASKMANAGER2_HOST}"
      TASKMANAGER3_HOST: "${TASKMANAGER3_HOST}"
      OPENOBSERVE_HOST: "openobserve"           # lokaler Container
      OPENOBSERVE_PORT: "5080"
      OPENOBSERVE_ORG: "${OPENOBSERVE_ORG}"
      OPENOBSERVE_AUTH: "${OPENOBSERVE_AUTH}"
      EXPERIMENT_TM_COUNT: "3"                  #  anpassen, wird angehängt an Datensatz
      EXPERIMENT_WINDOW_STRATEGY: "tumbling"    #  anpassen, wird angehängt an Datensatz
    depends_on:
      - openobserve
      - jobmanager
    networks:
      - cepha-network
    restart: on-failure

  # OpenObserve
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    user: "1000:1000"
    ports:
      - "5080:5080"
    environment:
      ZO_MAX_DASHBOARD_SERIES: 400000
      ZO_ROUTE_TIMEOUT: 1800
      ZO_MAX_FILE_SIZE_IN_MEMORY: 512
      ZO_MAX_FILE_SIZE_ON_DISK: 128
      ZO_COMPACT_MAX_FILE_SIZE: 512
      ZO_ROOT_USER_EMAIL: "${OPENOBSERVE_USER}"
      ZO_ROOT_USER_PASSWORD: "${OPENOBSERVE_PASSWORD}"
    volumes:
      - /mnt/data/openobserve:/data
    networks:
      - cepha-network
    restart: always

volumes:
  flink_dlq:
  flink_checkpoints:
  plugin_storage:
  pcap_uploads:

networks:
  cepha-network:
    driver: bridge