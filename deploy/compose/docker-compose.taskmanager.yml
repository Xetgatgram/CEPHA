# Taskmanager + Fluent Bit


services:
  flink-volume-init:
    image: busybox:latest
    container_name: flink-volume-init
    command: sh -c "mkdir -p /opt/flink/results /opt/flink/dlq &&
      chown -R 9999:9999 /opt/flink/results /opt/flink/dlq &&
      chmod -R 777 /opt/flink/results /opt/flink/dlq &&
      mkdir -p /var/fluent-bit && chmod 777 /var/fluent-bit"
    volumes:
      - flink_results:/opt/flink/results
      - flink_dlq:/opt/flink/dlq
      - fluent_bit_db:/var/fluent-bit

  taskmanager:
    image: ghcr.io/xetgatgram/cepha-manager:26.07.1
    container_name: flink-taskmanager
    command: taskmanager
    user: "9999:9999"
    ports:
      - "6121:6121"
      - "6122:6122"
      - "9249:9249"
      - "6125:6125"
    environment:
      JOB_MANAGER_RPC_ADDRESS: "${JOBMANAGER_HOST}"

      FLINK_PROPERTIES: |
        # ── Verbindung ───────────────────────────────────────────────
          jobmanager.rpc.address: ${JOBMANAGER_HOST}
          jobmanager.rpc.port: 6123
          taskmanager.bind-host: 0.0.0.0
          taskmanager.host: ${TASKMANAGER_HOST}
          taskmanager.rpc.port: 6122
          taskmanager.data.port: 6121

          # ── Slots ────────────────────────────────────────────────────
          taskmanager.numberOfTaskSlots: 4

          # ── Memory ───────────────────────────────────────────────────
          # Nur process.size + managed.size explizit. Flink berechnet
          # alles andere automatisch und konsistent.
          taskmanager.memory.process.size: 24g

          # Managed Memory fix: RocksDB (Batch) bekommt 3g = 750MB/Slot.
          # Flink verteilt den Rest (~20g) korrekt auf Heap + Overhead.
          taskmanager.memory.managed.size: 3g

          # Metaspace explizit: URLClassLoader pro Algorithm-JAR braucht Platz.
          taskmanager.memory.jvm-metaspace.size: 512m

          # JVM Overhead: Max hochsetzen damit Flink bei der Berechnung
          # nicht in die Overhead-Sanity-Check-Falle läuft.
          taskmanager.memory.jvm-overhead.min: 512m
          taskmanager.memory.jvm-overhead.max: 3g
          taskmanager.memory.jvm-overhead.fraction: 0.1

          # ── State Backend ────────────────────────────────────────────
          state.backend.type: rocksdb
          state.backend.rocksdb.memory.managed: true
          state.backend.rocksdb.memory.fixed-per-slot: true
          state.backend.incremental: true
          state.backend.rocksdb.timer-service.factory: heap
          state.backend.rocksdb.localdir: ${TASKMANAGER_SPILL_DIR}

          # ── Spilling / Temp ──────────────────────────────────────────
          io.tmp.dirs: ${TASKMANAGER_SPILL_DIR}
          taskmanager.working-dir: ${TASKMANAGER_SPILL_DIR}
          taskmanager.runtime.sort-in-batch: true

          # ── Checkpointing ────────────────────────────────────────────
          execution.checkpointing.interval: 120000
          execution.checkpointing.min-pause: 30000
          execution.checkpointing.timeout: 300000
          execution.checkpointing.mode: AT_LEAST_ONCE
          execution.checkpointing.num-retained: 2

          # ── RPC ──────────────────────────────────────────────────────
          pekko.framesize: 64m
          pekko.remote.netty.tcp.port: 0

          # ── JVM GC ───────────────────────────────────────────────────
          env.java.opts.taskmanager: -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:G1HeapRegionSize=16m -XX:+ParallelRefProcEnabled -XX:+DisableExplicitGC -XX:+ExitOnOutOfMemoryError -Djava.net.preferIPv4Stack=true

          # ── Metriken ─────────────────────────────────────────────────
          metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
          metrics.reporter.prom.port: 9249
          metrics.internal.query-service.port: 6125
          # --- Heartbeat & Timeout ---
          heartbeat.interval: 10000
          heartbeat.timeout: 120000
          heartbeat.rpc-failure-threshold: 5
          akka.ask.timeout: 120s
          akka.tcp.timeout: 120s
    volumes:
      - flink_results:/opt/flink/results
      - flink_dlq:/opt/flink/dlq
      - ${TASKMANAGER_SPILL_DIR}:${TASKMANAGER_SPILL_DIR}
    networks:
      - cepha-network
    restart: on-failure

  fluent-bit:
    image: ghcr.io/xetgatgram/cepha-fluent-bit:26.07.1
    container_name: fluent-bit
    volumes:
      - flink_results:/opt/flink/results:ro
      - fluent_bit_db:/var/fluent-bit
    environment:
      FLUENT_BIT_SOURCE: taskmanager
      FLUENT_BIT_DB_NAME: fluent-bit-taskmanager.db
      CURRENT_RUN: "${CURRENT_RUN:-run_default}"
      OPENOBSERVE_HOST: "${OPENOBSERVE_HOST}"
      OPENOBSERVE_PORT: "${OPENOBSERVE_PORT}"
      OPENOBSERVE_ORG: "${OPENOBSERVE_ORG}"
      OPENOBSERVE_STREAM: "${OPENOBSERVE_STREAM:-detection-results}"
      OPENOBSERVE_USER: "${OPENOBSERVE_USER}"
      OPENOBSERVE_PASSWORD: "${OPENOBSERVE_PASSWORD}"
    networks:
      - cepha-network
    restart: always

volumes:
  flink_results:
  flink_dlq:
  fluent_bit_db:

networks:
  cepha-network:
    driver: bridge
